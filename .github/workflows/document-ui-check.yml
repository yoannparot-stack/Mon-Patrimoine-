name: Verify document screens in the compiled personal APK

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Build run containing the exact personal APK to verify
        required: true
        default: '46069226737'
  push:
    paths:
      - '.github/workflows/document-ui-check.yml'

permissions:
  contents: read
  actions: read

jobs:
  android-documents:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run || '46069226737' }}
          name: ImmOptima-Firebase-Preview-TEST-APK
          path: installed-apk
      - name: Require the exact current application assets
        run: |
          python3 - <<'PY'
          import sys, zipfile
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from client_build import FILES
          apk=next(Path('installed-apk').rglob('*.apk'))
          with zipfile.ZipFile(apk) as z:
              for name in FILES:
                  assert z.read('assets/'+name)==Path(name).read_bytes(), name
          print('PASS exact current application assets; no recompilation or altered APK')
          PY
      - name: Allow the approved document brand while requiring the document title
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/android-ui.cjs')
          s=p.read_text()
          # The original OCR guard rejected any ImmOptima brand outside the main screen.
          # These two approved documents intentionally include that brand.
          s=s.replace("capture('26-bail-meuble','bail')", "capture('26-bail-meuble','baildelocation',true)")
          s=s.replace("capture('28-loyers-quittances','quittance')", "capture('28-loyers-quittances','quittancedeloyer',true)")
          assert "capture('26-bail-meuble','baildelocation',true)" in s
          assert "capture('28-loyers-quittances','quittancedeloyer',true)" in s
          p.write_text(s)
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QA transport
        run: |
          npm install --no-save --package-lock=false ws@8.18.0
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr
      - name: Verify the installed APK including the approved document screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: node tests/android-ui.cjs
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ImmOptima-Documents-Android-API-${{ matrix.api }}
          path: qa-out/android/
          if-no-files-found: warn
