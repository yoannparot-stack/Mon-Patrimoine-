name: Verify existing signed client APK
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Build run containing the V54 client artifact to verify
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  android-client-release:
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ImmOptima-Client-Beta-APK
          path: installed-client
          run-id: ${{ inputs.source_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QA transport
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr
      - name: Verify installed APK and capture real Android screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: node tests/android-client-release.cjs
      - name: Upload Android screenshots and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ImmOptima-Client-Release-API-${{ matrix.api }}
          path: qa-out/android-client/
          if-no-files-found: warn

