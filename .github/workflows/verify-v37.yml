name: Verify signed V37 Android APK

on:
  push:
    paths:
      - '.github/workflows/verify-v37.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  android-ui:
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ImmOptima-Firebase-Preview-TEST-APK
          path: installed-apk
          run-id: 42527208445
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QA transport
        run: |
          npm install --no-save --package-lock=false ws@8.18.0
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr
      - name: Verify installed APK and capture real Android screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: node tests/android-ui.cjs
      - name: Upload Android screenshots and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ImmOptima-Android-Verification-API-${{ matrix.api }}
          path: qa-out/android/
          if-no-files-found: warn

