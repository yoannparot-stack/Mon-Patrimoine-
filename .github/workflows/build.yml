name: Build Mon Patrimoine Android V1.3.2

on:
  workflow_dispatch:
  push:
    paths:
      - 'Mon_Patrimoine_V1.3.2_ANDROID_PREVIEW_GITHUB.zip'
      - '.github/workflows/build.yml'
      - 'index.html'
      - 'tests/**'
      - 'android-ux-patch.py'
      - 'qa_android.js'
      - 'qa_google_drive_migration.js'
      - 'qa_firebase_preflight.js'
      - 'qa_portfolio_sync.js'
      - 'qa_cloud_sync_gate.js'
      - 'cloud/portfolio-sync-core.js'
      - 'cloud/firestore.rules'
      - 'cloud/CONFIGURATION_ANDROID_IMMOPTIMA.md'
      - 'android-print-patch.py'
      - 'android-drive-patch.py'
      - 'android-firebase-patch.py'
      - 'android-auth-patch.py'
      - 'android-cloud-sync-patch.py'
      - 'cloud/immoptima-firebase-public.json'
      - 'scripts/setup-immoptima-signing.sh'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate persistent test signing credentials securely
        env:
          IMMOPTIMA_KEYSTORE_BASE64: ${{ secrets.IMMOPTIMA_KEYSTORE_BASE64 }}
          IMMOPTIMA_STORE_PASSWORD: ${{ secrets.IMMOPTIMA_STORE_PASSWORD }}
          IMMOPTIMA_KEY_ALIAS: ${{ secrets.IMMOPTIMA_KEY_ALIAS }}
          IMMOPTIMA_KEY_PASSWORD: ${{ secrets.IMMOPTIMA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$IMMOPTIMA_KEYSTORE_BASE64" || -z "$IMMOPTIMA_STORE_PASSWORD" || -z "$IMMOPTIMA_KEY_ALIAS" || -z "$IMMOPTIMA_KEY_PASSWORD" ]]; then
            echo "::error::One or more persistent signing secrets are missing."
            exit 1
          fi
          umask 077
          KEYSTORE="$RUNNER_TEMP/immoptima-preflight.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          if ! printf '%s' "$IMMOPTIMA_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"; then
            echo "::error::Keystore secret is not valid base64."
            exit 1
          fi
          if ! keytool -list -keystore "$KEYSTORE" -storepass:env IMMOPTIMA_STORE_PASSWORD -alias "$IMMOPTIMA_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Keystore password, alias, or keystore content is invalid."
            exit 1
          fi
          if ! keytool -importkeystore -srckeystore "$KEYSTORE" -srcstorepass:env IMMOPTIMA_STORE_PASSWORD -srcalias "$IMMOPTIMA_KEY_ALIAS" -srckeypass:env IMMOPTIMA_KEY_PASSWORD -destkeystore "$RUNNER_TEMP/immoptima-verify.p12" -deststoretype PKCS12 -deststorepass:env IMMOPTIMA_STORE_PASSWORD -destkeypass:env IMMOPTIMA_STORE_PASSWORD -noprompt > /dev/null 2>&1; then
            echo "::error::Key password does not unlock the signing key."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/immoptima-verify.p12"
          echo "Persistent signing credentials verified (values not disclosed)."

      - name: Extract Android project
        run: |
          mkdir android-project
          unzip Mon_Patrimoine_V1.3.2_ANDROID_PREVIEW_GITHUB.zip -d android-project
          find android-project -name settings.gradle -o -name settings.gradle.kts

      - name: Use the corrected HTML from the test branch
        run: |
          ROOT="$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs dirname)"
          test -n "$ROOT"
          ASSET_FILE="$ROOT/app/src/main/assets/index.html"
          mkdir -p "$(dirname "$ASSET_FILE")"
          test -f index.html
          cp index.html "$ASSET_FILE"
          test -s "$ASSET_FILE"
          echo "HTML Android mis à jour : $ASSET_FILE"
          wc -c "$ASSET_FILE"

      - name: Give this test APK a separate Android package ID
        run: |
          GRADLE_FILE="$(find android-project -path '*/app/build.gradle' -print -quit)"
          test -n "$GRADLE_FILE"
          sed -i "s/applicationId 'com.monpatrimoine.app.test'/applicationId 'com.immoptima.app'/" "$GRADLE_FILE"
          sed -i "s/versionCode 4/versionCode 11/" "$GRADLE_FILE"
          grep -nE "applicationId|versionCode" "$GRADLE_FILE"
          grep -F "applicationId 'com.immoptima.app'" "$GRADLE_FILE"

      - name: Fix WebView URL overload
        run: |
          JAVA_FILE="$(find android-project -path '*/app/src/main/java/com/monpatrimoine/app/MainActivity.java' -print -quit)"
          test -n "$JAVA_FILE"
          sed -i 's/shouldInterceptRequest(url)/shouldInterceptRequest(android.net.Uri.parse(url))/' "$JAVA_FILE"
          grep -nE 'shouldInterceptRequest\(((android\.net\.)?Uri\.parse\(url\))\)' "$JAVA_FILE"

      - name: Enable native Android PDF printing
        run: |
          ROOT="$(dirname "$(find android-project -name settings.gradle -print -quit)")"
          python3 android-print-patch.py "$ROOT"
          python3 android-drive-patch.py "$ROOT"
          cp cloud/immoptima-firebase-public.json "$ROOT/app/src/main/assets/immoptima-firebase.json"
          python3 android-firebase-patch.py "$ROOT"
          python3 android-auth-patch.py "$ROOT"
          python3 android-cloud-sync-patch.py "$ROOT"
          python3 android-ux-patch.py "$ROOT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run JavaScript QA checks
        run: |
          ROOT="$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs dirname)"
          echo "Projet Android : $ROOT"
          node qa_android.js "$ROOT"
          node qa_google_drive_migration.js
          node qa_firebase_preflight.js
          node qa_portfolio_sync.js
          node qa_cloud_sync_gate.js
          node tests/finance.cjs

      - name: Set up browser regression tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test actual mobile browser rendering and save screenshots
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/ui.cjs
      - name: Upload browser verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ImmOptima-Web-Verification
          path: qa-out/
          if-no-files-found: warn

      - name: Build debug APK
        run: |
          ROOT="$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs dirname)"
          cd "$ROOT"
          gradle :app:assembleDebug --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/apk-out/ImmOptima-Firebase-Preview-debug.apk"

      - name: Sign APK with persistent test certificate when configured
        env:
          IMMOPTIMA_KEYSTORE_BASE64: ${{ secrets.IMMOPTIMA_KEYSTORE_BASE64 }}
          IMMOPTIMA_STORE_PASSWORD: ${{ secrets.IMMOPTIMA_STORE_PASSWORD }}
          IMMOPTIMA_KEY_ALIAS: ${{ secrets.IMMOPTIMA_KEY_ALIAS }}
          IMMOPTIMA_KEY_PASSWORD: ${{ secrets.IMMOPTIMA_KEY_PASSWORD }}
        run: |
          if [ -z "$IMMOPTIMA_KEYSTORE_BASE64" ]; then
            echo "::error::Persistent signing secrets are missing. Refusing to publish an APK with an unstable certificate."
            exit 1
          fi
          test -n "$IMMOPTIMA_STORE_PASSWORD"
          test -n "$IMMOPTIMA_KEY_ALIAS"
          test -n "$IMMOPTIMA_KEY_PASSWORD"
          ROOT="$(dirname "$(find android-project -name settings.gradle -print -quit)")"
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          KEYSTORE="$RUNNER_TEMP/immoptima-signing.jks"
          umask 077
          printf '%s' "$IMMOPTIMA_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          export IMMOPTIMA_STORE_PASSWORD IMMOPTIMA_KEY_PASSWORD
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias "$IMMOPTIMA_KEY_ALIAS" --ks-pass env:IMMOPTIMA_STORE_PASSWORD --key-pass env:IMMOPTIMA_KEY_PASSWORD --out "$RUNNER_TEMP/signed.apk" "$APK"
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/signed.apk"
          cp "$RUNNER_TEMP/signed.apk" "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/apk-out/Mon-Patrimoine-V1.3.2-debug.apk"
          rm -f "$KEYSTORE"
          echo "APK signed with persistent ImmOptima test certificate."

      - name: Inspect APK signing certificate
        run: |
          ROOT="$(dirname "$(find android-project -name settings.gradle -print -quit)")"
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" > /tmp/immoptima-apk-certs.txt
          test -s /tmp/immoptima-apk-certs.txt
          cat /tmp/immoptima-apk-certs.txt
          grep -Ei 'SHA-1|SHA-256|SHA1|SHA256' /tmp/immoptima-apk-certs.txt || true
          echo "Certificate above is the persistent ImmOptima TEST signing identity (not the future Play Store release identity)."

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: ImmOptima-Firebase-Preview-TEST-APK
          path: apk-out/Mon-Patrimoine-V1.3.2-debug.apk
          if-no-files-found: error

  android-ui:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ImmOptima-Firebase-Preview-TEST-APK
          path: installed-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QA transport
        run: |
          npm install --no-save --package-lock=false ws@8.18.0
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr
      - name: Verify installed APK and capture real Android screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: node tests/android-ui.cjs
      - name: Upload Android screenshots and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ImmOptima-Android-Verification
          path: qa-out/android/
          if-no-files-found: warn
